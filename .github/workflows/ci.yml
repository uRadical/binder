name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./...

    - name: Run tests
      run: go test -race ./...

    - name: Run benchmarks
      run: go test -bench=. -benchmem ./...

    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted:"
          gofmt -s -l .
          exit 1
        fi

    - name: Run vet
      run: go vet ./...

    - name: Staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        staticcheck ./...

    - name: Vulnerability check
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    # A short run on every push; the seed corpus alone is covered by go test.
    - name: Fuzz smoke test
      run: |
        go test -run '^$' -fuzz 'FuzzBind$' -fuzztime=30s
        go test -run '^$' -fuzz 'FuzzBindWithOptions' -fuzztime=15s
        go test -run '^$' -fuzz 'FuzzBindStruct' -fuzztime=15s

  # go-crap needs a newer Go than the compatibility matrix above, and the score
  # does not vary by Go version, so it runs once in its own job.
  crap:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Install go-crap
      run: go install github.com/padiazg/go-crap@latest

    - name: Test with coverage
      run: go test -coverprofile=coverage.out ./...

    # Flags are kept in step with the Makefile's crap target.
    - name: CRAP score
      run: >-
        go-crap scan ./...
        --exclude 'example/.*\.go'
        --threshold 30
        --coverage-profile=coverage.out
        --fail-above